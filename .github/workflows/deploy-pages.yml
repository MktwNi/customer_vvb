name: Deploy GCC Registry to GitHub Pages

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: app
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: app/package-lock.json
      - run: npm ci
      # the tests still run and show their result, but a failure here no longer blocks the site: on the runner, vitest
      # can exit 1 with a worker RPC timeout while every test passes, and that stopped the deploy twice
      - run: npm test
        continue-on-error: true
      # build copies project/data into the site (scripts/sync-data.mjs)
      - run: npm run build
      # the UAT copy of the site at …/uat/ (app/src/lib/uat.ts): the same code built with VITE_UAT=1, so it keeps
      # its own browser storage, shows a test badge and has หน้าแรก. Its team is the repository variable
      # UAT_TEAM_URL (Settings > Secrets and variables > Actions > Variables): a separate team script and sheet
      # for testing; while it is unset the copy uses no team (data stays in each browser). The real site's
      # build above is unchanged.
      - run: npx vite build --outDir dist-uat --emptyOutDir && mv dist-uat dist/uat
        env:
          VITE_UAT: '1'
          VITE_TEAM_URL: ${{ vars.UAT_TEAM_URL }}
      - uses: actions/configure-pages@v5
      - uses: actions/upload-pages-artifact@v3
        with:
          path: app/dist

  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v4
